[workspace]
# Crates are appended here as each is created. Cargo refuses to load a
# workspace whose member manifest does not exist yet.
members = [
    "common", "transport", "server/entity", "server/migration", "server/server", "relay",
    "client/core", "client/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"

[workspace.dependencies]
anyhow = { version = "^1.0" }
thiserror = { version = "^2" }
serde = { version = "^1", features = ["derive"] }
serde_bytes = { version = "^0.11" }
serde_json = { version = "^1" }
toml = { version = "^0.9" }
# Comment-preserving TOML, for the one file tethera edits that it does not own:
# herdr's config.toml. Plain `toml` round-trips the values and discards every
# comment the operator wrote, which on somebody else's config is vandalism.
toml_edit = { version = "^0.25" }
postcard = { version = "^1.1", features = ["use-std"] }
ts-rs = { version = "^12.0" }
tokio = { version = "^1.53", features = [
    "macros", "rt-multi-thread", "sync", "time", "io-util", "net", "fs", "process", "signal",
] }
iroh = { version = "^1.1" }
iroh-relay = { version = "^1.1", features = ["server"] }
sea-orm = { version = "^2.0.2", features = [
    "sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono",
] }
sea-orm-migration = { version = "^2.0.2", features = [
    "sqlx-sqlite", "runtime-tokio-rustls",
] }
clap = { version = "^4.6", features = ["derive", "env"] }
tauri = { version = "^2.11", features = [] }
tauri-build = { version = "^2", features = [] }
log = { version = "^0.4" }
directories = { version = "^6.0" }
tracing = { version = "^0.1" }
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }
subtle = { version = "^2.6" }
sha2 = { version = "^0.10" }
qrcode = { version = "^0.14", default-features = false }
chrono = { version = "^0.4", features = ["serde"] }
url = { version = "^2.5" }
base64 = { version = "^0.22" }
rand = { version = "^0.8" }
libc = { version = "^0.2" }
rustls = { version = "^0.23", default-features = false, features = [
    "ring", "std", "tls12", "logging",
] }
rustls-pemfile = { version = "^2" }
moka = { version = "^0.12", features = ["sync"] }
tempfile = { version = "^3" }
uuid = { version = "^1", features = ["v4"] }
futures-util = { version = "^0.3", default-features = false, features = ["std"] }
tauri-plugin-deep-link = { version = "^2" }
tauri-plugin-barcode-scanner = { version = "^2" }
tauri-plugin-biometric = { version = "^2" }
tauri-plugin-dialog = { version = "^2" }
tauri-plugin-fs = { version = "^2" }
# Pinned by git, not by version. The crates.io name `tauri-plugin-keyring`
# belongs to a different, unrelated plugin by another author, so a version pin
# resolves to somebody else's credential store.
tauri-plugin-keyring = { git = "https://github.com/charlesportwoodii/tauri-plugin-keyring", branch = "master" }
# Android only, for the ndk-context shim in client/src-tauri/src/lib.rs. tao 0.35
# (Tauri 2.11) stopped initializing ndk-context (tauri-apps/tao#1154), so the
# activity has to bridge it and every crate that reads the Android context -
# the keyring store and iroh's network watcher among them - aborts without it.
# `jni` matches tao 0.35's own JNI bindings; a different major would hand the
# shim a JNIEnv from a different ABI.
jni = { version = "^0.21" }
ndk-context = { version = "^0.1" }
# Structured logging. One event goes to a human-readable console line and to a
# rotated JSON file, so the same run is both watchable and queryable.
curia = { version = "^0.2" }
# The same logging on the client, plus a sink that reaches the webview so the
# front end and the Rust side appear in one stream.
tauri-plugin-curia = { git = "https://github.com/charlesportwoodii/tauri-plugin-curia", tag = "0.2.0" }
vte = { version = "^0.15" }
unicode-width = { version = "^0.2" }
portable-pty = { version = "^0.9" }
# Raw mode and terminal size for the shim, which is the one place tethera is
# *inside* somebody else's terminal rather than owning one. Both are per-platform
# console calls — termios on unix, SetConsoleMode and
# GetConsoleScreenBufferInfo on Windows — and this is the smallest crate that
# covers both without hand-writing the Windows half.
#
# Default features, deliberately. `windows` is one of them and is not optional on
# Windows — crossterm refuses to compile without it, naming the feature but not
# the fact that turning defaults off is what removed it.
crossterm = { version = "^0.29" }

[profile.release]
opt-level = 3
strip = true
debug = false
codegen-units = 4
lto = true
incremental = false

[profile.dev]
opt-level = 1
debug = 1
incremental = true
codegen-units = 4
