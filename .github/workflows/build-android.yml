name: Build Android

# Inert on purpose. workflow_call is what build-all.yml needs to fan out to
# this workflow; neither trigger fires on its own. Add `push:` and
# `pull_request:` here to enable.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to check out (tag, branch, or SHA)'
        required: false
        default: ''
        type: string
      version:
        description: 'Version to patch into the config files before building'
        required: false
        default: ''
        type: string
      build_number:
        description: 'Atomic build number, used as versionCode'
        required: false
        default: ''
        type: string
      play_store_track:
        description: 'Play track (internal/alpha/beta/production). Empty means no upload.'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      ref:
        required: false
        default: ''
        type: string
      version:
        required: false
        default: ''
        type: string
      build_number:
        required: false
        default: ''
        type: string
      play_store_track:
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # semantic-release has already patched these files on the release commit.
      # This is for a dispatch against an unpatched ref, so a manual build still
      # carries the version and versionCode it will be uploaded under.
      - name: Patch version
        if: inputs.version != ''
        run: node .github/scripts/patch-versions.js "${{ inputs.version }}"

      # After the version patch, which writes its own versionCode. The build
      # number is the authority: it is the only value guaranteed to increase,
      # and Play rejects a versionCode it has already seen.
      - name: Apply build number
        if: inputs.build_number != ''
        run: node .github/scripts/set-build-number.js "${{ inputs.build_number }}"

      # Java 21, not a later version — the Android Gradle Plugin pins it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      # r28 or later, pinned rather than floating: r28 is the first NDK whose
      # linker defaults to a 16 KB max page size, which Play requires of every
      # 64-bit native library. On an older NDK the build succeeds and Play
      # rejects the upload, which is a slow way to find out.
      #
      # add-to-path is false so the NDK reaches the build through NDK_HOME only.
      # A toolchain on PATH lets a `clang` that is not the NDK's answer for the
      # cross compile, and that fails inside the linker.
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          add-to-path: false

      - uses: ./.github/actions/setup-rust
        with:
          # The two ABIs that run on real hardware. x86 and x86_64 are emulator
          # images, and building them doubles the Rust compile for a slice no
          # phone will install.
          target: |
            aarch64-linux-android
            armv7-linux-androideabi

      - run: mise trust --all

      # `client/src/js/bindings/` is gitignored, so a fresh checkout has no
      # generated TypeScript and the frontend would compile against types that
      # are not there.
      - run: mise run bindings
      - run: mise run deps

      # `client/src-tauri/gen/` is gitignored: the Android project is generated
      # and never committed, so CI has to make one before it can build one.
      # Without this the build fails with "Android Studio project directory
      # doesn't exist".
      #
      # The package script, not a bare `tauri android init`: init also has to be
      # followed by the overlay copy, and a local build and a CI build that
      # differ in that step produce different apps.
      - name: Initialise the Android project
        working-directory: client
        run: yarn tauri:android:init

      # tauri.conf.json's beforeBuildCommand builds the SvelteKit frontend, so
      # there is no separate frontend step here.
      - name: Build the Android app
        working-directory: client
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}

          # Named explicitly rather than left to cargo-mobile2 to derive. It
          # does derive them today, and when it stops, the failure is a linker
          # error naming a host toolchain — which reads as a broken runner
          # rather than as a missing variable.
          #
          # API 30 matches the client's minSdk.
          CC_aarch64_linux_android: aarch64-linux-android30-clang
          AR_aarch64_linux_android: llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: aarch64-linux-android30-clang

          CC_armv7_linux_androideabi: armv7a-linux-androideabi30-clang
          AR_armv7_linux_androideabi: llvm-ar
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER: armv7a-linux-androideabi30-clang
        run: |
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          yarn tauri android build --apk --aab --target aarch64 --target armv7

      - name: Locate the build outputs
        id: outputs
        working-directory: client
        run: |
          OUTPUTS=src-tauri/gen/android/app/build/outputs
          APK="$OUTPUTS/apk/universal/release/app-universal-release-unsigned.apk"
          AAB="$OUTPUTS/bundle/universalRelease/app-universal-release.aab"

          if [ ! -f "$APK" ] || [ ! -f "$AAB" ]; then
            echo "ERROR: the build reported success but did not write both an APK and an AAB."
            echo "  expected APK: $APK"
            echo "  expected AAB: $AAB"
            find "$OUTPUTS" -type f \( -name '*.apk' -o -name '*.aab' \) 2>/dev/null || echo "nothing found"
            exit 1
          fi

          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"

      - name: Sign the APK
        working-directory: client
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "Using build tools at $BUILD_TOOLS"

          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > upload-keystore.jks

          # -P 16, not -p. -p aligns .so entries to 4 KB, which a device with 16
          # KB memory pages cannot map, so the install fails on hardware the
          # build gave no sign of excluding.
          "$BUILD_TOOLS/zipalign" -v -P 16 4 \
            "${{ steps.outputs.outputs.apk }}" \
            tethera-android-release-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks upload-keystore.jks \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out tethera-android-release.apk \
            tethera-android-release-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose tethera-android-release.apk

          if ! "$BUILD_TOOLS/zipalign" -c -P 16 4 tethera-android-release.apk; then
            echo "ERROR: tethera-android-release.apk is not 16 KB aligned. Sideloaded installs fail on devices with 16 KB memory pages."
            exit 1
          fi

          ls -la tethera-android-release.apk

      - name: Sign the AAB
        working-directory: client
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cp "${{ steps.outputs.outputs.aab }}" tethera-android-release.aab

          jarsigner -verbose \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore upload-keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEYSTORE_PASSWORD" \
            tethera-android-release.aab \
            "$ANDROID_KEY_ALIAS"

          jarsigner -verify -verbose tethera-android-release.aab

          ls -la tethera-android-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: tethera-android-release-apk
          path: client/tethera-android-release.apk
          if-no-files-found: error

      # The AAB is what Play takes. The APK is for sideloading onto a device
      # without going through a track.
      - uses: actions/upload-artifact@v4
        with:
          name: tethera-android-release-aab
          path: client/tethera-android-release.aab
          if-no-files-found: error

      # Play takes the AAB. `status` is `draft` for production so a release to
      # everybody is never one workflow run away from being live; a testing
      # track completes on its own.
      - name: Upload to Google Play
        if: inputs.play_store_track != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.alaydriem.tethera
          releaseFiles: client/tethera-android-release.aab
          track: ${{ inputs.play_store_track }}
          status: ${{ inputs.play_store_track == 'production' && 'draft' || 'completed' }}

      # A signing key on a shared runner's disk. Removed unconditionally,
      # because a failed build is exactly when it is still sitting there.
      - name: Remove the keystore
        if: always()
        working-directory: client
        run: rm -f upload-keystore.jks
