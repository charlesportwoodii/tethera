name: Tests

# Inert on purpose. workflow_call is what build-all.yml needs to fan out to
# this workflow; neither trigger fires on its own. Add `push:` and
# `pull_request:` here to enable.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  # The Rust gate. `test-all` rather than a hand-written list of steps: the task
  # already declares the suite, and a second copy of that list in YAML is a
  # second thing to drift.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - run: mise trust --all
      - run: mise run test-all

  # Separate, and deliberately not part of the gate. `client/src/` is another
  # team's in-flight component work, so a failure here is theirs mid-edit and
  # not ours — reporting it as our breakage is how a red run stops meaning
  # anything.
  client:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - run: mise trust --all
      - run: mise run test-client
