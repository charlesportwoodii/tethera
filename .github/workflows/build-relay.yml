name: Build relay

# Inert on purpose. workflow_call is what build-all.yml needs to fan out to
# this workflow; neither trigger fires on its own. Add `push:` and
# `pull_request:` here to enable.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    env:
      # See build-server.yml: the mise task is a bare `cargo build -p`, so the
      # triple is handed to cargo through the environment.
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools musl-dev

      - uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}

      - run: mise trust --all
      - run: mise run build-relay

      # The relay is a thing somebody deploys onto a host they do not build on,
      # so the binary is the point of the job. It was being built and discarded.
      - uses: actions/upload-artifact@v4
        with:
          name: tethera-relay-${{ matrix.target }}
          path: target/${{ matrix.target }}/debug/tethera-relay
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build relay image
        run: docker build -f relay/Dockerfile .

      # Enable by replacing `false` with a real condition and adding a
      # docker/login-action step above. Needs permissions: packages: write.
      - name: Push to ghcr
        if: false
        run: docker push ghcr.io/alaydriem/tethera-relay:latest
