name: Build relay

# Inert on purpose. workflow_call is what build-all.yml and release.yml need to
# fan out to this workflow; neither trigger fires on its own.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Cargo profile (debug or release)'
        required: false
        default: debug
        type: string
      ref:
        description: 'Git ref to check out (tag, branch, or SHA)'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      profile:
        required: false
        default: debug
        type: string
      ref:
        required: false
        default: ''
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools musl-dev

      - uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}

      - run: mise trust --all
      - run: mise run build-relay ${{ inputs.profile == 'release' && '--release' || '' }}

      # The relay is deployed onto a host nobody builds on, so the binary is the
      # point of the job. It was being built and discarded.
      - uses: actions/upload-artifact@v4
        with:
          name: tethera-relay-${{ matrix.target }}
          path: target/${{ matrix.target }}/${{ inputs.profile }}/tethera-relay
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Build relay image
        run: docker build -f relay/Dockerfile .

      # Enable by replacing `false` with a real condition and adding a
      # docker/login-action step above. Needs permissions: packages: write.
      - name: Push to ghcr
        if: false
        run: docker push ghcr.io/alaydriem/tethera-relay:latest
