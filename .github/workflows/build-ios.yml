name: Build iOS

# Inert on purpose. workflow_call is what build-all.yml needs to fan out to
# this workflow; neither trigger fires on its own. Add `push:` and
# `pull_request:` here to enable.
#
# This is the only workflow that can build iOS at all: the Tauri CLI's `ios`
# subcommand does not exist on Windows, so this cannot be reproduced on the
# Windows runners used elsewhere in this repo's CI.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to check out (tag, branch, or SHA)'
        required: false
        default: ''
        type: string
      version:
        description: 'Version to patch into the config files before building'
        required: false
        default: ''
        type: string
      build_number:
        description: 'Atomic build number, used as CFBundleVersion'
        required: false
        default: ''
        type: string
      testflight_upload:
        description: 'Upload the IPA to TestFlight'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      ref:
        required: false
        default: ''
        type: string
      version:
        required: false
        default: ''
        type: string
      build_number:
        required: false
        default: ''
        type: string
      testflight_upload:
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Both patches run before `tauri ios init`, because the init script reads
      # tauri.conf.json to write the generated Info.plist. Patching afterwards
      # would leave the built app on the version it was generated with.
      - name: Patch version
        if: inputs.version != ''
        run: node .github/scripts/patch-versions.js "${{ inputs.version }}"

      # After the version patch, which writes its own CFBundleVersion. The build
      # number is the authority: App Store Connect refuses a CFBundleVersion it
      # has already accepted for this CFBundleShortVersionString.
      - name: Apply build number
        if: inputs.build_number != ''
        run: node .github/scripts/set-build-number.js "${{ inputs.build_number }}"

      - uses: ./.github/actions/setup-rust
        with:
          target: aarch64-apple-ios

      - run: mise trust --all

      # `client/src/js/bindings/` is gitignored, so a fresh checkout has no
      # generated TypeScript and the frontend would compile against types that
      # are not there.
      - run: mise run bindings
      - run: mise run deps

      # `client/src-tauri/gen/` is gitignored: the Xcode project is generated
      # and never committed, so CI has to make one before it can build one.
      # Without this the build fails with "Xcode project directory doesn't
      # exist".
      #
      # The package script, not a bare `tauri ios init`: it also installs
      # Info.ios.plist over the generated Info.plist, writes the version numbers
      # into it and adds the frameworks the Rust static library links against,
      # none of which survive init.
      - name: Initialise the Xcode project
        working-directory: client
        run: yarn tauri:ios:init

      - name: Install the signing certificate and provisioning profile
        id: signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          # Scoped to this run: the keychain is created here and destroyed at the
          # end of the job, so the password only has to outlive the job.
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          set -eu

          CERTIFICATE="$RUNNER_TEMP/certificate.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE"

          # A keychain of our own rather than the login keychain, so nothing
          # this job installs outlives it on a runner image.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$CERTIFICATE" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

          # Decoded once and kept: the verification step below reads the same
          # plist rather than shelling out to `security cms` a second time.
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"

          # Xcode finds an installed profile by its UUID and by nothing else, so
          # the file has to be named for the UUID inside it.
          UUID="$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision

          echo "profile_uuid=$UUID" >> "$GITHUB_OUTPUT"

      # Checked here rather than left to xcodebuild. Both mismatches below are
      # properties of the two secrets and are knowable in a second; xcodebuild
      # finds them forty seconds into a compile and reports them as two separate
      # errors against the .xcodeproj, which reads as a problem with the
      # generated project rather than with a secret holding the wrong file.
      - name: Verify the signing material matches this app
        run: |
          set -eu

          PLIST="$RUNNER_TEMP/profile.plist"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"

          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PLIST")"
          # application-identifier is "<TEAMID>.<bundle id>"; drop the prefix.
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PLIST")"
          PROFILE_APP="${APP_ID#*.}"
          WANTED_APP="$(node -p "require('./client/src-tauri/tauri.conf.json').identifier")"

          echo "profile      : $PROFILE_NAME"
          echo "profile app  : $PROFILE_APP"
          echo "this app     : $WANTED_APP"

          if [ "$PROFILE_APP" != "$WANTED_APP" ]; then
            echo ""
            echo "ERROR: IOS_PROVISIONING_PROFILE_BASE64 holds a profile for a different app."
            echo ""
            echo "  Create an App Store profile for $WANTED_APP at"
            echo "    https://developer.apple.com/account/resources/profiles"
            echo "  and select the Apple Distribution certificate whose .p12 is in"
            echo "  APPLE_CERTIFICATE_BASE64. Then replace the secret with:"
            echo "    base64 -i <name>.mobileprovision | pbcopy"
            exit 1
          fi

          # A profile embeds the certificates it will sign with. A certificate
          # made after the profile is not in it, and that is its own error.
          CERTS=""
          i=0
          while raw="$(plutil -extract "DeveloperCertificates.$i" raw -o - "$PLIST" 2>/dev/null)"; do
            printf '%s' "$raw" | base64 -d > "$RUNNER_TEMP/profile-cert.der"
            CERTS="$CERTS $(openssl x509 -inform DER -in "$RUNNER_TEMP/profile-cert.der" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')"
            i=$((i + 1))
          done

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk 'NR==1 { print $2 }')"

          echo "profile holds $i certificate(s)"
          echo "keychain identity: $IDENTITY"

          case "$CERTS" in
            *"$IDENTITY"*)
              echo "ok the profile includes the certificate that was imported"
              ;;
            *)
              echo ""
              echo "ERROR: the profile does not include the certificate in APPLE_CERTIFICATE_BASE64."
              echo ""
              echo "  A profile embeds the certificates it may sign with, so one generated"
              echo "  before that certificate existed will never include it. Regenerate the"
              echo "  profile with the certificate selected, then update the secret."
              exit 1
              ;;
          esac

      # After init, which writes a project set to Automatic signing.
      - name: Switch the project to manual signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: node .github/scripts/ios-manual-signing.mjs

      - name: Prepare ExportOptions.plist
        working-directory: client
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          set -eu

          sed -e "s/__TEAM_ID__/$APPLE_TEAM_ID/g" \
              -e "s/__PROFILE_UUID__/$IOS_PROFILE_UUID/g" \
              src-tauri/ExportOptions.ios.plist > src-tauri/gen/apple/ExportOptions.plist

          cat src-tauri/gen/apple/ExportOptions.plist

      # tauri.conf.json's beforeBuildCommand builds the SvelteKit frontend, so
      # there is no separate frontend step here.
      - name: Build the iOS app
        working-directory: client
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: yarn tauri ios build --export-method app-store-connect

      - name: Collect the IPA
        working-directory: client
        run: |
          set -eu

          IPA="$(find src-tauri/gen/apple/build -name '*.ipa' -type f | sort | head -1 || true)"

          if [ -z "$IPA" ]; then
            echo "FAIL the build reported success but wrote no IPA."
            find src-tauri/gen/apple/build -type f || true
            exit 1
          fi

          cp "$IPA" tethera-ios-release.ipa
          ls -la tethera-ios-release.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: tethera-ios-release-ipa
          path: client/tethera-ios-release.ipa
          if-no-files-found: error

      # The API key, not an Apple ID: an app-specific password needs a human to
      # have made one and does not survive two-factor changes.
      - name: Upload to TestFlight
        if: inputs.testflight_upload
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: client/tethera-ios-release.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      # A distribution identity and a provisioning profile on a shared runner.
      # Removed unconditionally, because a failed build is exactly when they are
      # still installed.
      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null || true
