name: Build all

on:
  workflow_dispatch:
  pull_request:
  # master is release.yml's trigger, and it fans out to these same workflows at
  # the release tag. Without the exclusion every merge builds everything twice,
  # and the two runs race for the same Play track.
  push:
    branches-ignore:
      - master

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      common: ${{ steps.filter.outputs.common }}
      transport: ${{ steps.filter.outputs.transport }}
      server: ${{ steps.filter.outputs.server }}
      relay: ${{ steps.filter.outputs.relay }}
      client: ${{ steps.filter.outputs.client }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            common:
              - 'common/**'
            transport:
              - 'transport/**'
            server:
              - 'server/**'
            relay:
              - 'relay/**'
            client:
              - 'client/**'
            # Everything that changes how a build runs rather than what it
            # builds. Without this a change to build-android.yml matches no
            # filter, so the job it rewrote is the one job that does not run.
            ci:
              - '.github/**'
              - 'mise.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'

  tests:
    needs: changes
    if: |
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.transport == 'true' ||
      needs.changes.outputs.server == 'true' ||
      needs.changes.outputs.relay == 'true' ||
      needs.changes.outputs.client == 'true'
    uses: ./.github/workflows/tests.yml

  build-server:
    needs: changes
    if: |
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.transport == 'true' ||
      needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/build-server.yml

  build-relay:
    needs: changes
    if: |
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.relay == 'true'
    uses: ./.github/workflows/build-relay.yml

  build-android:
    needs: changes
    if: |
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.client == 'true'
    uses: ./.github/workflows/build-android.yml
    secrets: inherit

  build-ios:
    needs: changes
    if: |
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.client == 'true'
    uses: ./.github/workflows/build-ios.yml
    secrets: inherit
