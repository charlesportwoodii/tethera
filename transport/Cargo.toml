[package]
name = "tethera-transport"
edition.workspace = true
version.workspace = true
license.workspace = true
autotests = false

[lib]
name = "tethera_transport"
path = "src/lib.rs"

[features]
# The loopback helpers. Enabled by this crate's own tests, and by the server's
# dev-dependencies so the protocol suite dials a real endpoint pair.
testing = []

[dependencies]
tethera-common = { path = "../common" }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
postcard = { workspace = true }
iroh = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# The loopback helpers this crate's own tests dial through.
tethera-transport = { path = ".", features = ["testing"] }

[[test]]
name = "integration"
path = "tests/integration.rs"
