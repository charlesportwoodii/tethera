[package]
name = "tethera-client"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "tethera_client_lib"
# staticlib is what the iOS link step consumes and cdylib is what Android's JNI
# loader opens. Dropping either breaks the mobile build with an error that does
# not name the cause.
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "tethera-client"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
