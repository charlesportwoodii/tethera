[package]
name = "tethera-client"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "tethera_client_lib"
# staticlib is what the iOS link step consumes and cdylib is what Android's JNI
# loader opens. Dropping either breaks the mobile build with an error that does
# not name the cause.
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "tethera-client"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tethera-client-core = { path = "../core" }
tethera-common = { path = "../../common" }
tethera-transport = { path = "../../transport" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
iroh = { workspace = true }
# Not used directly beyond installing the provider. See run() in src/lib.rs.
rustls = { workspace = true }
tauri-plugin-keyring = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
tauri-plugin-curia = { workspace = true }
# Only to register curia's bridge as a layer. Without a subscriber the chain
# log -> tracing -> curia has no middle and every record is dropped.
tracing-subscriber = { workspace = true }

# Mobile only. Target-gated so a desktop build never compiles a scanner it has
# no camera for.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = { workspace = true }
tauri-plugin-biometric = { workspace = true }

# The ndk-context shim. See the initNdkContext export in src/lib.rs.
[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }
ndk-context = { workspace = true }
